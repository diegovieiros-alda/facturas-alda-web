<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facturas Alda — Acceso</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(!t)t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{color-scheme:light;--bg:#f3f4f7;--surface:#ffffff;--border:#e0e3ea;--text:#1c2029;--text2:#5b6472;--text3:#8b93a3;--accent:#4f46e5;--accent2:#4338ca;--red:#dc2626;--error-bg:#fdeaea;--error-border:#f3b9b9;--error-fg:#a3231f;--shadow:0 24px 64px rgba(15,17,25,.12)}
  :root[data-theme="dark"]{color-scheme:dark;--bg:#0f1117;--surface:#1a1d27;--border:#2a2d3e;--text:#f9fafb;--text2:#9ca3af;--text3:#6b7280;--accent:#6366f1;--accent2:#5558e3;--red:#ef4444;--error-bg:#3b1a1a;--error-border:#7f1d1d;--error-fg:#fca5a5;--shadow:0 24px 64px rgba(0,0,0,.4)}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;transition:background .15s}
  .btn-theme{position:absolute;top:20px;right:20px;width:auto;background:none;border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;margin-top:0}
  .btn-theme:hover{color:var(--text);background:var(--surface)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:48px 40px;width:360px;box-shadow:var(--shadow)}
  .logo{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
  h1{font-size:22px;font-weight:600;color:var(--text);margin-bottom:32px}
  label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  input{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;margin-bottom:16px;outline:none;transition:border-color .15s}
  input:focus{border-color:var(--accent)}
  button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;transition:background .15s}
  button:hover{background:var(--accent2)}
  button:disabled{opacity:.5;cursor:wait}
  .error{background:var(--error-bg);border:1px solid var(--error-border);color:var(--error-fg);border-radius:8px;padding:10px 14px;font-size:13px;margin-top:12px;display:none}
</style>
</head>
<body>
<button class="btn-theme" id="btnTheme" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
<div class="card">
  <p class="logo">Alda Hotels</p>
  <h1>Portal de Facturas</h1>
  <label>Usuario</label>
  <input type="text" id="username" autocomplete="username" autofocus>
  <label>Contraseña</label>
  <input type="password" id="password" autocomplete="current-password">
  <button id="btn" onclick="login()">Acceder</button>
  <div class="error" id="err"></div>
</div>
<script>
function toggleTheme(){
  const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('theme',next);
  document.getElementById('btnTheme').textContent=next==='dark'?'☀️':'🌙';
}
document.getElementById('btnTheme').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙';
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
async function login(){
  const btn=document.getElementById('btn'), err=document.getElementById('err');
  btn.disabled=true; btn.textContent='Verificando...'; err.style.display='none';
  const r=await fetch('__BASE_PATH__/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
  if(r.ok){window.location.href='__BASE_PATH__/';}else{const d=await r.json();err.textContent=d.error||'Error';err.style.display='block';btn.disabled=false;btn.textContent='Acceder';}
}
</script>
</body>
</html>
