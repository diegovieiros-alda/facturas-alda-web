<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facturas Alda — Acceso</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Helvetica Neue',Arial,sans-serif;background:#0f1117;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#1a1d27;border:1px solid #2a2d3e;border-radius:12px;padding:48px 40px;width:360px;box-shadow:0 24px 64px rgba(0,0,0,.4)}
  .logo{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#6b7280;margin-bottom:8px}
  h1{font-size:22px;font-weight:600;color:#f9fafb;margin-bottom:32px}
  label{display:block;font-size:12px;font-weight:500;color:#9ca3af;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  input{width:100%;padding:11px 14px;background:#0f1117;border:1px solid #2a2d3e;border-radius:8px;color:#f9fafb;font-size:14px;margin-bottom:16px;outline:none;transition:border-color .15s}
  input:focus{border-color:#6366f1}
  button{width:100%;padding:12px;background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;transition:background .15s}
  button:hover{background:#5558e3}
  button:disabled{opacity:.5;cursor:wait}
  .error{background:#3b1a1a;border:1px solid #7f1d1d;color:#fca5a5;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <p class="logo">Alda Hotels</p>
  <h1>Portal de Facturas</h1>
  <label>Usuario</label>
  <input type="text" id="username" autocomplete="username" autofocus>
  <label>Contraseña</label>
  <input type="password" id="password" autocomplete="current-password">
  <button id="btn" onclick="login()">Acceder</button>
  <div class="error" id="err"></div>
</div>
<script>
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
async function login(){
  const btn=document.getElementById('btn'), err=document.getElementById('err');
  btn.disabled=true; btn.textContent='Verificando...'; err.style.display='none';
  const r=await fetch('__BASE_PATH__/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
  if(r.ok){window.location.href='__BASE_PATH__/';}else{const d=await r.json();err.textContent=d.error||'Error';err.style.display='block';btn.disabled=false;btn.textContent='Acceder';}
}
</script>
</body>
</html>
