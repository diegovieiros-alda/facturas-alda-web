<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histórico — Facturas Alda Hotels</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(!t)t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --bg:#f3f4f7;--surface:#ffffff;--surface2:#eef0f4;--surface3:#e4e7ee;--border:#e0e3ea;
  --text:#1c2029;--text2:#5b6472;--text3:#6b7280;
  --accent:#4f46e5;--accent2:#4338ca;
  --green:#0f9d58;--red:#dc2626;--yellow:#b45309;
  --badge-pendiente-bg:#fef3e2;--badge-pendiente-fg:#9a5b13;
  --badge-aprobada-bg:#e7f8ef;--badge-aprobada-fg:#0d7a48;
  --badge-rechazada-bg:#fdeaea;--badge-rechazada-fg:#b42323;
  --error-grave-bg:#fdecec;--error-grave-fg:#a3231f;
  --error-leve-bg:#fef6e3;--error-leve-fg:#8a5a09;
  --pdf-bg:#e4e7ee;
  --shadow-sm:0 1px 2px rgba(15,17,25,.06);--shadow-md:0 10px 30px rgba(15,17,25,.1);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1117;--surface:#1a1d27;--surface2:#21253a;--surface3:#282c40;--border:#2a2d3e;
  --text:#f9fafb;--text2:#9ca3af;--text3:#8792a6;
  --accent:#6366f1;--accent2:#818cf8;
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;
  --badge-pendiente-bg:#451a03;--badge-pendiente-fg:#fed7aa;
  --badge-aprobada-bg:#052e16;--badge-aprobada-fg:#bbf7d0;
  --badge-rechazada-bg:#450a0a;--badge-rechazada-fg:#fecaca;
  --error-grave-bg:#3b0000;--error-grave-fg:#fca5a5;
  --error-leve-bg:#3b2000;--error-leve-fg:#fcd34d;
  --pdf-bg:#222;
  --shadow-sm:0 1px 2px rgba(0,0,0,.25);--shadow-md:0 20px 60px rgba(0,0,0,.5);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:20px;border:2px solid var(--bg)}
*{scrollbar-width:thin;scrollbar-color:var(--surface2) transparent}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:16px}
.logo-mark{width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,var(--accent),var(--accent2));flex-shrink:0}
.logo-text{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.logo-sep{width:1px;height:20px;background:var(--border)}
.header-title{font-size:13px;color:var(--text2)}
.header-right{display:flex;align-items:center;gap:12px}
.btn-icon{background:none;border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;transition:all .15s}
.btn-icon:hover{border-color:var(--text3);color:var(--text);background:var(--surface2)}
main{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:20px 24px;gap:14px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar select,.toolbar input[type=text],.toolbar input[type=search]{padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
.toolbar select:focus,.toolbar input:focus{border-color:var(--accent)}
.search-wrap{position:relative}
.search-wrap::before{content:'⌕';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.search-wrap input{padding-left:28px!important;width:220px}
.fecha-row{display:flex;align-items:center;gap:6px}
.fecha-row input[type=date]{padding:7px 8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;outline:none}
.fecha-row span{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.btn-clear-fecha{background:none;border:1px solid var(--border);color:var(--text3);border-radius:6px;padding:6px 8px;font-size:11px;cursor:pointer}
.btn-clear-fecha:hover{color:var(--text);border-color:var(--text3)}
.toolbar-spacer{flex:1}
.toolbar-info{font-size:12px;color:var(--text2);white-space:nowrap}
.toolbar-info strong{color:var(--text)}
.btn{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);transition:all .15s}
.btn:hover{border-color:var(--text3);background:var(--surface3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.table-wrap{flex:1;overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--surface2);text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:700;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
thead th:hover{color:var(--text)}
thead th.sorted{color:var(--accent)}
thead th .arrow{font-size:10px;margin-left:3px;opacity:.7}
thead th.no-sort{cursor:default}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
tbody tr.fila{cursor:pointer;transition:background .1s}
tbody tr.fila:hover{background:var(--surface2)}
tbody tr.fila.expanded{background:var(--surface2)}
tbody tr:last-child td{border-bottom:none}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.chevron{display:inline-block;width:12px;color:var(--text3);font-size:10px}
.expand-row td{padding:0;background:var(--bg);cursor:default}
.expand-content{padding:18px 24px;display:grid;grid-template-columns:1fr 380px;gap:20px;animation:fadein .15s ease;white-space:normal}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.expand-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.mini-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px}
.mini-card-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.datos-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dato-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.dato-valor{font-size:13px;font-weight:500;white-space:normal;word-break:break-word}
.dato-valor.importe{font-size:16px;font-weight:700;color:var(--green)}
.errores{display:flex;flex-direction:column;gap:6px}
.error-item{padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.4;white-space:normal}
.error-grave{background:var(--error-grave-bg);color:var(--error-grave-fg);border-left:3px solid var(--red)}
.error-leve{background:var(--error-leve-bg);color:var(--error-leve-fg);border-left:3px solid var(--yellow)}
.pdf-frame{width:100%;height:460px;border:none;background:var(--pdf-bg);border-radius:8px}
.pdf-unavail{padding:30px 16px;text-align:center;color:var(--text3);font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.link-newtab{font-size:11px;color:var(--accent);text-decoration:none;align-self:flex-end;margin-bottom:6px}
.link-newtab:hover{text-decoration:underline}
.fi-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;display:inline-block}
.mini-tag{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:5px;background:var(--error-grave-bg);color:var(--error-grave-fg)}
.mini-tag.info{background:var(--error-leve-bg);color:var(--error-leve-fg)}
.badge-pendiente{background:var(--badge-pendiente-bg);color:var(--badge-pendiente-fg)}
.badge-aprobada{background:var(--badge-aprobada-bg);color:var(--badge-aprobada-fg)}
.badge-rechazada{background:var(--badge-rechazada-bg);color:var(--badge-rechazada-fg)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;color:var(--text3);font-size:13px;gap:10px}
.empty-state-icon{font-size:32px;opacity:.35}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent2);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer-bar{display:flex;justify-content:center;padding:14px}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <span class="logo-text"><span class="logo-mark"></span>Alda Hotels</span>
    <div class="logo-sep"></div>
    <span class="header-title">Histórico de Facturas</span>
  </div>
  <div class="header-right">
    <button class="btn-icon" onclick="window.location.href='__BASE_PATH__/log'" title="Log de procesamiento (n8n)" aria-label="Ver log de procesamiento">📋 Log</button>
    <button class="btn-icon" onclick="window.location.href='__BASE_PATH__/'" title="Volver a revisión">← Revisión</button>
    <button class="btn-icon" id="btnTheme" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">🌙</button>
    <button class="btn-icon" onclick="logout()">Salir</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <select id="selEstado" onchange="onFiltroChange()" aria-label="Filtrar por estado">
      <option value="all">Todas</option>
      <option value="pendiente">Pendientes</option>
      <option value="aprobada">Aprobadas</option>
      <option value="rechazada">Rechazadas</option>
    </select>
    <select id="selHotel" onchange="onFiltroChange()" aria-label="Filtrar por hotel">
      <option value="">Todos los hoteles</option>
    </select>
    <select id="selSociedad" onchange="onFiltroChange()" aria-label="Filtrar por sociedad">
      <option value="">Todas las sociedades</option>
    </select>
    <div class="search-wrap">
      <input type="search" id="inputBuscar" placeholder="Buscar por proveedor, nº factura, hotel..." oninput="onBuscarInput()" aria-label="Buscar facturas">
    </div>
    <div class="fecha-row">
      <span>Del</span>
      <input type="date" id="inputDesde" onchange="onFiltroChange()" aria-label="Fecha desde">
      <span>al</span>
      <input type="date" id="inputHasta" onchange="onFiltroChange()" aria-label="Fecha hasta">
      <button class="btn-clear-fecha" id="btnClearFecha" onclick="limpiarFechas()" style="display:none" title="Quitar filtro de fechas" aria-label="Quitar filtro de fechas">✕</button>
    </div>
    <div class="toolbar-spacer"></div>
    <span class="toolbar-info" id="toolbarInfo"></span>
    <button class="btn" onclick="exportarCSV()">⬇ Exportar CSV</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-sort="factura_fecha">Fecha <span class="arrow"></span></th>
          <th data-sort="factura_numero">Nº Factura <span class="arrow"></span></th>
          <th data-sort="proveedor_nombre">Proveedor <span class="arrow"></span></th>
          <th class="no-sort">Hotel</th>
          <th data-sort="importe_total">Importe <span class="arrow"></span></th>
          <th data-sort="estado">Estado <span class="arrow"></span></th>
          <th class="no-sort">Revisor</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="7"><div class="empty-state"><div class="spinner"></div>Cargando...</div></td></tr>
      </tbody>
    </table>
  </div>
  <div class="footer-bar" id="footerBar"></div>
</main>

<script>
const _fetch=window.fetch;
window.fetch=async(...args)=>{
  if(typeof args[0]==='string' && args[0].startsWith('/')) args[0]='__BASE_PATH__'+args[0];
  const r=await _fetch(...args);
  if(r.status===401){ window.location.href='__BASE_PATH__/login'; throw new Error('Sesión expirada'); }
  return r;
};

function toggleTheme(){
  const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('theme',next);
  document.getElementById('btnTheme').textContent=next==='dark'?'☀️':'🌙';
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('btnTheme').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙';
});

function esc(s){return s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtFecha(f){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(f||'');return m?`${m[3]}/${m[2]}/${m[1]}`:'—';}
function fmtImporte(n){return n?Number(n).toLocaleString('es-ES',{minimumFractionDigits:2})+' €':'—';}
function fmtDateTime(dt){if(!dt)return'—';return new Date(dt).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}

let items=[], offset=0, total=0, busqueda='', desde='', hasta='', sort='factura_fecha', dir='desc', buscarTimer=null, expandedId=null;
const PAGE=100;

function primerDiaMes(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;}
function hoyISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

async function cargarFiltros(){
  const {hoteles,sociedades}=await fetch('/api/facturas/filtros').then(r=>r.json()).catch(()=>({hoteles:[],sociedades:[]}));
  document.getElementById('selHotel').insertAdjacentHTML('beforeend', hoteles.map(h=>`<option value="${esc(h)}">${esc(h)}</option>`).join(''));
  document.getElementById('selSociedad').insertAdjacentHTML('beforeend', sociedades.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join(''));
}

let reqId=0;
async function cargar(reset=true){
  if(reset) offset=0;
  const params=new URLSearchParams({offset,limit:PAGE,sort,dir});
  const estado=document.getElementById('selEstado').value;
  const hotel=document.getElementById('selHotel').value;
  const sociedad=document.getElementById('selSociedad').value;
  if(estado!=='all') params.set('estado',estado);
  if(hotel) params.set('hotel',hotel);
  if(sociedad) params.set('sociedad',sociedad);
  if(busqueda) params.set('q',busqueda);
  if(desde) params.set('desde',desde);
  if(hasta) params.set('hasta',hasta);
  const id=++reqId;
  const {items:page,total:t,totalImporte}=await fetch(`/api/facturas?${params}`).then(r=>r.json()).catch(()=>({items:[],total:0,totalImporte:0}));
  if(id!==reqId) return;
  items = reset ? page : items.concat(page);
  total=t;
  document.getElementById('toolbarInfo').innerHTML=total>0?`<strong>${total}</strong> facturas · <strong>${fmtImporte(totalImporte)}</strong>`:'';
  renderTabla();
  renderFooter();
  renderCabeceras();
}

function renderCabeceras(){
  document.querySelectorAll('th[data-sort]').forEach(th=>{
    const arrow=th.querySelector('.arrow');
    if(th.dataset.sort===sort){ th.classList.add('sorted'); arrow.textContent=dir==='asc'?'↑':'↓'; }
    else{ th.classList.remove('sorted'); arrow.textContent=''; }
  });
}

function renderFooter(){
  const el=document.getElementById('footerBar');
  el.innerHTML = items.length<total ? `<button class="btn" onclick="cargarMas()">Cargar más (${items.length}/${total})</button>` : '';
}
function cargarMas(){offset+=PAGE;cargar(false);}

function renderTabla(){
  const tbody=document.getElementById('tbody');
  if(!items.length){
    const filtrando=busqueda||desde||hasta||document.getElementById('selEstado').value!=='all'||document.getElementById('selHotel').value||document.getElementById('selSociedad').value;
    tbody.innerHTML=`<tr><td colspan="7"><div class="empty-state"><div class="empty-state-icon">${filtrando?'⌕':'📄'}</div>${filtrando?'Ningún resultado con estos filtros':'No hay facturas'}</div></td></tr>`;
    return;
  }
  tbody.innerHTML=items.map(f=>{
    const abierto=expandedId===f.id;
    const fila=`
    <tr class="fila${abierto?' expanded':''}" onclick="toggleExpand(${f.id})" title="Ver detalle">
      <td><span class="chevron">${abierto?'▾':'▸'}</span>${fmtFecha(f.factura_fecha)}</td>
      <td>${esc(f.factura_numero)||'—'}${f.posible_duplicado?'<span class="mini-tag" title="Otra factura comparte número y proveedor">Duplicada</span>':''}</td>
      <td>${esc(f.proveedor_nombre)||'—'}</td>
      <td>${esc(f.hotel_nombre_editado||f.hotel_nombre_odoo)||'—'}${(!f.hotel_nombre_editado&&(!f.hotel_nombre_odoo||f.hotel_nombre_odoo==='No identificado'))?'<span class="mini-tag">Sin hotel</span>':''}</td>
      <td class="num">${fmtImporte(f.importe_total)}${f.importe_total!=null&&f.importe_total<0?'<span class="mini-tag info">Abono</span>':''}</td>
      <td><span class="fi-badge badge-${f.estado}">${f.estado}</span></td>
      <td>${esc(f.revisor_nombre)||'—'}</td>
    </tr>`;
    const expand=abierto?`<tr class="expand-row"><td colspan="7">${renderExpandido(f)}</td></tr>`:'';
    return fila+expand;
  }).join('');
}

function toggleExpand(id){
  expandedId = expandedId===id ? null : id;
  renderTabla();
}

function renderExpandido(f){
  const eg=Array.isArray(f.errores_graves)?f.errores_graves:[];
  const el=Array.isArray(f.errores_leves)?f.errores_leves:[];
  return `<div class="expand-content">
    <div class="expand-col">
      <div class="mini-card">
        <div class="mini-card-title">Datos de la factura</div>
        <div class="datos-grid">
          <div><div class="dato-label">Nº Factura</div><div class="dato-valor">${esc(f.factura_numero)||'—'}</div></div>
          <div><div class="dato-label">Fecha</div><div class="dato-valor">${fmtFecha(f.factura_fecha)}</div></div>
          <div><div class="dato-label">Importe total</div><div class="dato-valor importe">${fmtImporte(f.importe_total)}</div></div>
          <div><div class="dato-label">Base imponible</div><div class="dato-valor">${fmtImporte(f.base_imponible)}</div></div>
          <div><div class="dato-label">Forma de pago</div><div class="dato-valor">${esc(f.forma_pago_detalle)||'—'}</div></div>
          <div><div class="dato-label">CIF proveedor</div><div class="dato-valor">${esc(f.proveedor_cif)||'—'}</div></div>
        </div>
        ${f.concepto?`<div style="margin-top:10px"><div class="dato-label">Concepto</div><div class="dato-valor" style="font-size:12px;color:var(--text2)">${esc(f.concepto)}</div></div>`:''}
      </div>
      <div class="mini-card">
        <div class="mini-card-title">Hotel / DocuWare</div>
        <div class="datos-grid">
          <div><div class="dato-label">Identificado como</div><div class="dato-valor">${esc(f.hotel_nombre_odoo)||'No identificado'}</div></div>
          <div><div class="dato-label">Código hotel</div><div class="dato-valor">${esc(f.codigo_hotel)||'—'}</div></div>
          <div><div class="dato-label">Sociedad</div><div class="dato-valor">${esc(f.sociedad)||'—'}</div></div>
          <div><div class="dato-label">DocuWare hotel</div><div class="dato-valor">${esc(f.hotel_nombre_editado||f.dw_hotel)||'—'}</div></div>
        </div>
      </div>
      ${(eg.length||el.length)?`<div class="mini-card"><div class="mini-card-title">Incidencias detectadas</div><div class="errores">${eg.map(e=>`<div class="error-item error-grave">🔴 ${esc(e)}</div>`).join('')}${el.map(e=>`<div class="error-item error-leve">🟡 ${esc(e)}</div>`).join('')}</div></div>`:''}
      ${f.estado!=='pendiente'?`<div class="mini-card"><div class="mini-card-title">Revisión</div><div class="dato-valor">${esc(f.revisor_nombre)||'—'} · ${fmtDateTime(f.revisado_at)}</div>${f.nota_revisor?`<div class="dato-valor" style="margin-top:6px;font-size:12px;color:var(--text2);font-weight:400">${esc(f.nota_revisor)}</div>`:''}</div>`:''}
    </div>
    <div class="expand-col">
      ${f.pdf_filename
        ?`<a class="link-newtab" href="__BASE_PATH__/api/facturas/${f.id}/pdf" target="_blank" onclick="event.stopPropagation()">Abrir en pestaña nueva ↗</a><iframe class="pdf-frame" src="__BASE_PATH__/api/facturas/${f.id}/pdf"></iframe>`
        :`<div class="pdf-unavail">📄 PDF no disponible${f.solo_enlace?' (esta factura solo llegó con enlace de descarga)':''}</div>`}
    </div>
  </div>`;
}

function onFiltroChange(){
  desde=document.getElementById('inputDesde').value;
  hasta=document.getElementById('inputHasta').value;
  document.getElementById('btnClearFecha').style.display=(desde||hasta)?'':'none';
  cargar();
}
function onBuscarInput(){
  clearTimeout(buscarTimer);
  buscarTimer=setTimeout(()=>{busqueda=document.getElementById('inputBuscar').value.trim();cargar();},300);
}
function limpiarFechas(){
  desde='';hasta='';
  document.getElementById('inputDesde').value='';
  document.getElementById('inputHasta').value='';
  document.getElementById('btnClearFecha').style.display='none';
  cargar();
}

document.querySelectorAll('th[data-sort]').forEach(th=>{
  th.addEventListener('click',()=>{
    const col=th.dataset.sort;
    if(sort===col) dir = dir==='asc' ? 'desc' : 'asc';
    else { sort=col; dir = col==='proveedor_nombre'||col==='factura_numero'||col==='estado' ? 'asc' : 'desc'; }
    cargar();
  });
});

async function exportarCSV(){
  const params=new URLSearchParams({offset:0,limit:1000,sort,dir});
  const estado=document.getElementById('selEstado').value;
  const hotel=document.getElementById('selHotel').value;
  const sociedad=document.getElementById('selSociedad').value;
  if(estado!=='all') params.set('estado',estado);
  if(hotel) params.set('hotel',hotel);
  if(sociedad) params.set('sociedad',sociedad);
  if(busqueda) params.set('q',busqueda);
  if(desde) params.set('desde',desde);
  if(hasta) params.set('hasta',hasta);
  const {items:rows}=await fetch(`/api/facturas?${params}`).then(r=>r.json());
  const cols=['factura_fecha','factura_numero','proveedor_nombre','proveedor_cif','hotel_nombre_odoo','hotel_nombre_editado','importe_total','base_imponible','estado','revisor_nombre'];
  const csvEsc=v=>{ if(v==null) return ''; const s=String(v).replace(/"/g,'""'); return /[",\n]/.test(s)?`"${s}"`:s; };
  const csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>csvEsc(r[c])).join(','))).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`facturas_historico_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function logout(){await fetch('/api/logout',{method:'POST'});window.location.href='__BASE_PATH__/login';}

// Por defecto se muestra el mes en curso — con cientos de facturas acumuladas no
// tiene sentido traerlas todas de entrada; "Quitar filtro" (✕) muestra el histórico completo.
desde=primerDiaMes(); hasta=hoyISO();
document.getElementById('inputDesde').value=desde;
document.getElementById('inputHasta').value=hasta;
document.getElementById('btnClearFecha').style.display='';
cargarFiltros();
cargar();
</script>
