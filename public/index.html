<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facturas Alda Hotels</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(!t)t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --bg:#f3f4f7;--surface:#ffffff;--surface2:#eef0f4;--surface3:#e4e7ee;--border:#e0e3ea;
  --text:#1c2029;--text2:#5b6472;--text3:#6b7280;
  --accent:#4f46e5;--accent2:#4338ca;
  --green:#0f9d58;--green-dark:#0b7a44;--red:#dc2626;--red-dark:#b91c1c;--yellow:#b45309;--orange:#c2410c;
  --badge-pendiente-bg:#fef3e2;--badge-pendiente-fg:#9a5b13;
  --badge-aprobada-bg:#e7f8ef;--badge-aprobada-fg:#0d7a48;
  --badge-rechazada-bg:#fdeaea;--badge-rechazada-fg:#b42323;
  --error-grave-bg:#fdecec;--error-grave-fg:#a3231f;
  --error-leve-bg:#fef6e3;--error-leve-fg:#8a5a09;
  --toast-success-bg:#e7f8ef;--toast-success-fg:#0d7a48;
  --toast-error-bg:#fdeaea;--toast-error-fg:#a3231f;
  --motivo-bg:#fef3e2;--motivo-fg:#8a5a09;--motivo-border:#f2d097;
  --modal-overlay:rgba(20,22,30,.4);--pdf-bg:#e4e7ee;
  --shadow-sm:0 1px 2px rgba(15,17,25,.06);--shadow-md:0 10px 30px rgba(15,17,25,.1);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1117;--surface:#1a1d27;--surface2:#21253a;--surface3:#282c40;--border:#2a2d3e;
  --text:#f9fafb;--text2:#9ca3af;--text3:#8792a6;
  --accent:#6366f1;--accent2:#818cf8;
  --green:#10b981;--green-dark:#059669;--red:#ef4444;--red-dark:#dc2626;--yellow:#f59e0b;--orange:#f97316;
  --badge-pendiente-bg:#451a03;--badge-pendiente-fg:#fed7aa;
  --badge-aprobada-bg:#052e16;--badge-aprobada-fg:#bbf7d0;
  --badge-rechazada-bg:#450a0a;--badge-rechazada-fg:#fecaca;
  --error-grave-bg:#3b0000;--error-grave-fg:#fca5a5;
  --error-leve-bg:#3b2000;--error-leve-fg:#fcd34d;
  --toast-success-bg:#052e16;--toast-success-fg:#bbf7d0;
  --toast-error-bg:#450a0a;--toast-error-fg:#fecaca;
  --motivo-bg:#2a1f00;--motivo-fg:#fcd34d;--motivo-border:#78350f;
  --modal-overlay:rgba(8,9,14,.75);--pdf-bg:#222;
  --shadow-sm:0 1px 2px rgba(0,0,0,.25);--shadow-md:0 20px 60px rgba(0,0,0,.5);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;transition:background .15s,color .15s}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:20px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--border)}
*{scrollbar-width:thin;scrollbar-color:var(--surface2) transparent}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:16px}
.logo-mark{width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,var(--accent),var(--accent2));flex-shrink:0}
.logo-text{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--text)}
.logo-sep{width:1px;height:20px;background:var(--border)}
.header-title{font-size:13px;color:var(--text2)}
.header-right{display:flex;align-items:center;gap:12px}
.user-badge{font-size:12px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px}
.btn-icon{background:none;border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;transition:all .15s}
.btn-icon:hover{border-color:var(--text3);color:var(--text);background:var(--surface2)}
.layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 56px);min-height:0}
.sidebar{width:340px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--surface);min-height:0}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sidebar-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.8px}
.badge-count{background:var(--accent);color:#fff;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;transition:transform .15s}
.filter-tabs{display:flex;padding:8px 12px;gap:4px;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;text-align:center;padding:6px 4px;font-size:11px;font-weight:600;color:var(--text3);background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab:hover{color:var(--text2);background:var(--surface2)}
.tab.active{background:var(--surface2);border-color:var(--border);color:var(--text)}
.tab-count{font-size:12px;font-weight:700;color:var(--text)}
.tab.active .tab-count{color:var(--accent2)}
.filtros-extra{padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.search-wrap{position:relative}
.search-wrap::before{content:'⌕';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.search-wrap input{padding-left:28px!important}
.filtros-extra select,.filtros-extra input[type=text],.filtros-extra input[type=search]{width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;outline:none}
.btn-filtros-toggle{background:none;border:none;color:var(--accent2);font-size:11px;font-weight:600;cursor:pointer;padding:2px 0;text-align:left;align-self:flex-start}
.btn-filtros-toggle:hover{text-decoration:underline}
.filtros-avanzados{display:flex;flex-direction:column;gap:8px}
.fecha-row,.importe-row{display:flex;align-items:center;gap:6px}
.fecha-row input[type=date],.importe-row input[type=number]{flex:1;min-width:0;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:11px;outline:none}
.fecha-row input[type=date]:focus,.importe-row input[type=number]:focus{border-color:var(--accent)}
.fecha-row span,.importe-row span{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.btn-clear-fecha{background:none;border:1px solid var(--border);color:var(--text3);border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer;transition:all .15s;flex-shrink:0}
.btn-clear-fecha:hover{color:var(--text);border-color:var(--text3)}
.sum-importe{font-size:11px;color:var(--text3);text-align:right}
.sum-importe:not(:empty)::before{content:'Suma: '}
.factura-list{overflow-y:auto;flex:1;min-height:0}
.pager{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0;font-size:12px}
.pager button{background:none;border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px;transition:all .15s}
.pager button:hover:not(:disabled){border-color:var(--text3);color:var(--text);background:var(--surface2)}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager-info{font-weight:600;color:var(--text)}
.factura-item{padding:14px 16px 14px 13px;border-bottom:1px solid var(--border);border-left:3px solid transparent;cursor:pointer;transition:background .12s,border-color .12s}
.factura-item.estado-pendiente{border-left-color:rgba(180,83,9,.4)}
.factura-item.estado-aprobada{border-left-color:rgba(15,157,88,.35)}
.factura-item.estado-rechazada{border-left-color:rgba(220,38,38,.35)}
.factura-item:hover{background:var(--surface2)}
.factura-item.selected{background:var(--surface2);border-left-color:var(--accent)}
.fi-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.fi-numero{font-size:13px;font-weight:600}
.fi-fecha{font-size:11px;color:var(--text3)}
.fi-proveedor{font-size:12px;color:var(--text2);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.tag-warn,.tag-info{font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px;display:inline-block}
.tag-warn{background:var(--error-grave-bg);color:var(--error-grave-fg)}
.tag-info{background:var(--error-leve-bg);color:var(--error-leve-fg)}
.fi-footer{display:flex;align-items:center;justify-content:space-between}
.fi-importe{font-size:13px;font-weight:600}
.fi-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.badge-pendiente{background:var(--badge-pendiente-bg);color:var(--badge-pendiente-fg)}
.badge-aprobada{background:var(--badge-aprobada-bg);color:var(--badge-aprobada-fg)}
.badge-rechazada{background:var(--badge-rechazada-bg);color:var(--badge-rechazada-fg)}
.fi-hotel{font-size:11px;color:var(--text3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--text3);font-size:13px;gap:10px;padding:0 24px;text-align:center}
.empty-state-icon{font-size:32px;opacity:.35}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent2);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.detail{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.detail-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text3)}
.detail-empty-icon{font-size:48px;opacity:.25}
.detail-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-shrink:0}
.detail-numero{font-size:21px;font-weight:700;letter-spacing:-.2px}
.detail-proveedor{font-size:14px;color:var(--text2);margin-top:3px}
.detail-actions{display:flex;gap:8px;flex-shrink:0}
.detail-body{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;animation:fadein .18s ease;min-height:0}
.detail-body>*{flex-shrink:0}
@media (max-width: 900px){
  body{height:auto;overflow:visible}
  .layout{flex-direction:column;height:auto;overflow:visible}
  .sidebar{width:100%;max-height:45vh;border-right:none;border-bottom:1px solid var(--border)}
}
.btn{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--green);color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:var(--green-dark);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-danger{background:var(--red);color:#fff;box-shadow:var(--shadow-sm)}
.btn-danger:hover{background:var(--red-dark);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--text3);background:var(--surface3)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-copy{background:none;border:none;cursor:pointer;font-size:11px;opacity:.55;padding:0 0 0 4px;vertical-align:middle}
.btn-copy:hover{opacity:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .15s;box-shadow:var(--shadow-sm)}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:6px}
.card-body{padding:16px}
.datos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 24px}
.dato-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.dato-valor{font-size:13px;font-weight:500}
.dato-valor.importe{font-size:19px;font-weight:700;color:var(--green);letter-spacing:-.3px}
.dato-valor.importe.negativo{color:var(--red)}
.dato-valor.dato-falta{color:var(--yellow);font-weight:600}
.dato-alerta{background:var(--motivo-bg);border:1px solid var(--motivo-border);border-radius:6px;padding:8px}
.errores{display:flex;flex-direction:column;gap:6px}
.error-item{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-radius:6px;font-size:12px;line-height:1.4}
.error-grave{background:var(--error-grave-bg);border-left:3px solid var(--red);color:var(--error-grave-fg)}
.error-leve{background:var(--error-leve-bg);border-left:3px solid var(--yellow);color:var(--error-leve-fg)}
.input-hotel,.input-nota{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:10px 12px;outline:none;transition:border-color .15s;font-family:inherit}
.input-nota{resize:vertical;min-height:70px;font-size:13px}
.input-hotel:focus,.input-nota:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.pdf-frame{width:100%;height:600px;border:none;background:var(--pdf-bg);border-radius:0 0 10px 10px}
.pdf-unavail{height:200px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px;flex-direction:column;gap:8px}
.modal-overlay{display:none;position:fixed;inset:0;background:var(--modal-overlay);backdrop-filter:blur(3px);z-index:200;align-items:center;justify-content:center;animation:fadein .15s ease}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;width:440px;max-width:90vw;box-shadow:var(--shadow-md)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:999;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:var(--shadow-md)}
.toast.success{background:var(--toast-success-bg);border:1px solid var(--green);color:var(--toast-success-fg)}
.toast.error{background:var(--toast-error-bg);border:1px solid var(--red);color:var(--toast-error-fg)}
.toast.show{opacity:1;transform:translateY(0)}
.undo-banner{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 14px 12px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:998;box-shadow:var(--shadow-md);align-items:center;gap:14px}
.undo-banner.show{display:flex}
.undo-banner .btn{padding:6px 14px;font-size:12px}
.form-label{display:block;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
input[type=text],input[type=password],select{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;margin-bottom:8px;outline:none}
input[type=text]:focus,input[type=password]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
select option{background:var(--surface);color:var(--text)}
.admin-user-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.admin-user-name{flex:1;font-size:13px}
.admin-user-rol{font-size:11px;color:var(--text3);background:var(--surface2);padding:2px 8px;border-radius:10px}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px}
.actividad-item{font-size:12px;padding:6px 0;border-bottom:1px solid var(--border)}
.actividad-item:last-child{border-bottom:none}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="undo-banner" id="undoBanner">
  <span id="undoMsg"></span>
  <button class="btn btn-secondary" onclick="deshacerAccion()">Deshacer</button>
</div>

<header>
  <div class="header-left">
    <span class="logo-text"><span class="logo-mark" aria-hidden="true"></span>Alda Hotels</span>
    <div class="logo-sep"></div>
    <span class="header-title">Validación de Facturas</span>
  </div>
  <div class="header-right">
    <span class="user-badge" id="userBadge">—</span>
    <button class="btn-icon" onclick="window.location.href='__BASE_PATH__/historico'" title="Histórico completo" aria-label="Ver histórico completo">📊 Histórico</button>
    <button class="btn-icon" onclick="window.location.href='__BASE_PATH__/log'" title="Log de procesamiento (n8n)" aria-label="Ver log de procesamiento">📋 Log</button>
    <button class="btn-icon" id="btnTheme" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">🌙</button>
    <button class="btn-icon" id="btnAdmin" style="display:none" onclick="openAdmin()" aria-label="Gestión de usuarios">⚙ Usuarios</button>
    <button class="btn-icon" onclick="logout()">Salir</button>
  </div>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Facturas</span>
      <span class="badge-count" id="badgeTotal">0</span>
    </div>
    <div class="filter-tabs">
      <button class="tab active" onclick="setFiltro('pendiente',this)">Pendientes<span class="tab-count" id="tabCountPendiente">0</span></button>
      <button class="tab" onclick="setFiltro('aprobada',this)">Aprobadas<span class="tab-count" id="tabCountAprobada">0</span></button>
      <button class="tab" onclick="setFiltro('rechazada',this)">Rechazadas<span class="tab-count" id="tabCountRechazada">0</span></button>
      <button class="tab" onclick="setFiltro('all',this)">Todas<span class="tab-count" id="tabCountTotal">0</span></button>
    </div>
    <div class="filtros-extra">
      <!-- ponytail: señuelo para que Chrome autorrellene esto (no el buscador) con la credencial guardada del login -->
      <input type="text" name="username" autocomplete="username" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">
      <input type="password" name="password" autocomplete="current-password" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">
      <div class="search-wrap">
        <input type="search" id="inputBuscar" name="busqueda-facturas" autocomplete="off" placeholder="Buscar por proveedor, nº factura, hotel..." oninput="onBuscarInput()" aria-label="Buscar facturas" style="padding-left:28px">
      </div>
      <select id="selHotelFiltro" onchange="onFiltroExtraChange()" aria-label="Filtrar por hotel">
        <option value="">Todos los hoteles</option>
      </select>
      <button class="btn-filtros-toggle" id="btnFiltrosAvanzados" onclick="toggleFiltrosAvanzados()" aria-expanded="false" aria-controls="filtrosAvanzados">Más filtros ▾</button>
      <div class="filtros-avanzados" id="filtrosAvanzados" style="display:none">
        <div class="fecha-row">
          <span>Del</span>
          <input type="date" id="inputDesde" onchange="onFechaChange()" aria-label="Fecha desde">
          <span>al</span>
          <input type="date" id="inputHasta" onchange="onFechaChange()" aria-label="Fecha hasta">
          <button class="btn-clear-fecha" id="btnClearFecha" onclick="limpiarFechas()" style="display:none" title="Quitar filtro de fechas" aria-label="Quitar filtro de fechas">✕</button>
        </div>
        <div class="importe-row">
          <span>€</span>
          <input type="number" id="inputImporteMin" placeholder="Mín" onchange="onFiltroExtraChange()" aria-label="Importe mínimo">
          <span>–</span>
          <input type="number" id="inputImporteMax" placeholder="Máx" onchange="onFiltroExtraChange()" aria-label="Importe máximo">
        </div>
      </div>
      <div class="sum-importe" id="sumImporte"></div>
    </div>
    <div class="factura-list" id="listaFacturas">
      <div class="empty-state"><div class="spinner"></div>Cargando...</div>
    </div>
    <div class="pager" id="pager"></div>
  </div>

  <div class="detail" id="detail">
    <div class="detail-empty">
      <div class="detail-empty-icon">📋</div>
      <div>Selecciona una factura para revisarla</div>
    </div>
  </div>
</div>

<!-- Modal aprobar -->
<div class="modal-overlay" id="modalAprobar">
  <div class="modal">
    <h3>✓ Aprobar factura</h3>

<script>
// ponytail: lista estática de hoteles/sociedades DocuWare (misma fuente que usa n8n) —
// evita que el revisor tenga que escribir a mano el "código. Nombre" exacto
const HOTELES={"012":"Coste General Consultores Hoteleros Integrales S.L","100":"Coste General Alda Compostela S.L","101":"Alda O Fogar de Teodomiro","102":"Alda Casco Antiguo","103":"Alda Centro León","106":"Hotel Alda Algalia","107":"Alda Barrio Húmedo","108":"Lucus","109":"Alda San Carlos","110":"Alda Pilgrim León","111":"Alda Catedral","112":"Alda Avenida","113":"Alda Vía León","114":"Alda Bonaval","115":"Alda San Bieito","116":"Alda Camiño Inglés","117":"Alda Vía de la Plata Rooms","118":"Alda Fogar Natural","119":"Alda Pilgrim Astorga","200":"Coste General Alda Castilla S.L","201":"Alda Entrearcos","202":"Alda Centro Palencia","203":"Alda Fogar Natural","204":"Alda Cardeña","205":"Alda Palencia Plaza","206":"Alda Centro Ponferrada","207":"Alda Ciudad de Soria","208":"Alda Estella","209":"Alda Río Duero","210":"Alda Centro Zaragoza","211":"Alda Jolio Jaca","213":"Alda Pilgrim Ponferrada","214":"Alda Centro Pamplona","215":"Alda Zaragoza Independencia","216":"Alda Mercado de Zamora","217":"Alda Río Tormes","218":"Alda Ciudad de Toro","219":"Alda Castillo de Olite","220":"Alda Malvasía","221":"Alda Route 42","222":"Alda Mirador del Moncayo","223":"Alda Puerto Seco","224":"Alda Valladolid Sur","225":"Zeta Students Burgos","226":"Alda Centro Zamora","227":"Alda Soria Rooms","228":"Apartamentos Alda Palencia Catedral","229":"Alda Peñafiel","230":"Alda Posada de Egues","231":"Alda Triskel","232":"Alda Nueva Castilla","233":"Alda El Espinar","234":"Alda Guijuelo","235":"Alda A Boira","236":"Alda Plaza Mayor Toro","237":"Alda Ruta Castilla","238":"Alda Ciudad de Corella","300":"Coste General Alda Rias Baixas S.L","301":"Alda Bueumar","302":"Alda Estación Vigo","303":"Alda Puerta del Sol","304":"Alda Porta do Sol","305":"Alda Estación Pontevedra","306":"Alda Estación Ourense","307":"Alda Santa Tecla","308":"Alda Vía Norte","309":"Alda Lalín","310":"Alda Palas de Rei","312":"Alda Centro Pontevedra","313":"Alda Carril","314":"Alda Castelao","315":"Alda Boiro","316":"Alda Barraña Playa","317":"Apartamentos Alda O Grove","318":"Alda Alpina","319":"Alda Ribeira","320":"Alda Xinzo","321":"Alda Altiana","400":"Coste General Hoteles Rias Altas S.L","401":"Alda Puerta Coruña","402":"Alda Santa Cristina","403":"Alda Sada Marina","404":"Apartamentos Alda Santa Cristina","405":"Alda El Suizo","406":"Hotel Agüera","407":"Alda Palacio Valdés","408":"Alda Galería Coruña","409":"Alda Pasaje","410":"Alda Centro Oviedo","411":"Alda Estación Oviedo","412":"Alda Miramar","413":"Alda Orzán","414":"Alda Alborán Rooms","415":"Alda Don Carlos","416":"Hotel Coruñamar","417":"Alda Puerto Calderón","418":"Alda Cabanas Playa","419":"Alda Fogar do Mariñeiro","420":"Alda Triacastela","421":"Alda Cabanas Nature","422":"Alda Narón","423":"Alda Carballo","424":"Alda Corcubión","425":"Alda Arteixo","500":"Coste General Alda Hostels Hostelería S.L","501":"Garfo Sta. Trega","502":"Garfo Puerto Seco","503":"Garfo Cocina Central","504":"Coffe Bakers Orzán","505":"Garfo Sada","506":"Garfo Carril","507":"Garfo Cabanas","600":"Coste general Obedientrophy Unipessoal Lda","601":"Valença do Minho","700":"Coste general Alda Hotels Bavaro","701":"Alda Bavaro","800":"Coste general Restauradores de Comida Atlántica S.L","801":"Taberna Central","802":"A Nosa Taberna Corrubedo","803":"A Nosa Taberna Coruña","804":"A Nosa Taberna Compostela","805":"A Nosa Taberna Carril","806":"Alda Corrubedo","807":"A Nosa Taberna Palas de Rei","900":"Costes Generales Niuco Homes S.L","901":"IH Ciudad de Valladolid","902":"IH Ciudad del Cine","903":"IH Ciudad de Avilés","904":"IH Felipe Prieto","905":"IH Fogar Natural","906":"IH Santa Crisitina","907":"IH Porta do Sol","908":"IH Palencia Catedral"};

// motivo_revision cuyo problema es la identificación del hotel — resalta el campo
// "DocuWare hotel" en vez de dejar el aviso solo como párrafo suelto arriba.
const MOTIVOS_HOTEL = ['factura_dirigida_a_sociedad', 'multiples_centros', 'costes_generales_posible_hotel'];

let facturas=[], facturaActual=null, filtroActual='pendiente', me=null;
let pagina=0, total=0, busqueda='', buscarTimer=null, desde='', hasta='', hotelFiltro='', importeMin='', importeMax='';
const PAGE=50;

// La sesión puede expirar (ej. redeploy del servidor) — si cualquier fetch devuelve 401,
// manda al login en vez de dejar que la página se quede mostrando listas vacías en silencio.
const _fetch=window.fetch;
window.fetch=async(...args)=>{
  if(typeof args[0]==='string' && args[0].startsWith('/')) args[0]='__BASE_PATH__'+args[0];
  const r=await _fetch(...args);
  if(r.status===401 && !args[0].includes('/api/login')){ window.location.href='__BASE_PATH__/login'; throw new Error('Sesión expirada'); }
  return r;
};

function toggleTheme(){
  const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('theme',next);
  document.getElementById('btnTheme').textContent=next==='dark'?'☀️':'🌙';
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('btnTheme').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙';
});

// Escapa HTML para cualquier valor que venga del email/factura/proveedor antes de
// meterlo en innerHTML — sin esto, un proveedor podía inyectar JS vía el nombre,
// concepto, asunto, etc. y ejecutarlo en la sesión de un admin autenticado.
function esc(s){return s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// El valor real ("233. Alda El Espinar") viaja tal cual a DocuWare/n8n, que lo
// necesita con el código — esto solo limpia lo que se le muestra al revisor.
function nombreSinCodigo(h){return h?h.replace(/^\d+\.\s*/,''):h;}

function copiar(texto){
  if(!texto) return;
  navigator.clipboard.writeText(texto).then(()=>toast('Copiado al portapapeles','success')).catch(()=>toast('No se pudo copiar','error'));
}

async function init(){
  me=await fetch('/api/me').then(r=>r.json());
  document.getElementById('userBadge').textContent=me.nombre;
  if(me.rol==='admin') document.getElementById('btnAdmin').style.display='';
  const {hoteles}=await fetch('/api/facturas/filtros').then(r=>r.json()).catch(()=>({hoteles:[]}));
  document.getElementById('selHotelFiltro').insertAdjacentHTML('beforeend', hoteles.map(h=>`<option value="${esc(h)}">${esc(nombreSinCodigo(h))}</option>`).join(''));
  await cargarFacturas();
  setInterval(()=>cargarFacturas(false),30000);
}

let facturasReqId=0;
async function cargarFacturas(resetPagina=true){
  if(resetPagina) pagina=0;
  const params=new URLSearchParams({offset:pagina*PAGE,limit:PAGE});
  if(filtroActual!=='all') params.set('estado',filtroActual);
  if(busqueda) params.set('q',busqueda);
  if(desde) params.set('desde',desde);
  if(hasta) params.set('hasta',hasta);
  if(hotelFiltro) params.set('hotel',hotelFiltro);
  if(importeMin!=='') params.set('importeMin',importeMin);
  if(importeMax!=='') params.set('importeMax',importeMax);
  // Cambiar de pestaña rápido dispara varias fetch en paralelo — sin esto, una
  // respuesta más lenta de una carga anterior podía llegar después y pisar la
  // lista con datos de otro filtro (ej. mostrar "rechazadas" bajo la pestaña "aprobadas").
  const reqId=++facturasReqId;
  const {items,total:t,totalImporte}=await fetch(`/api/facturas?${params}`).then(r=>r.json()).catch(()=>({items:[],total:0,totalImporte:0}));
  if(reqId!==facturasReqId) return;
  facturas=items;
  total=t;
  const statsParams=new URLSearchParams();
  if(desde) statsParams.set('desde',desde);
  if(hasta) statsParams.set('hasta',hasta);
  const stats=await fetch(`/api/stats?${statsParams}`).then(r=>r.json()).catch(()=>({}));
  if(reqId!==facturasReqId) return;
  document.getElementById('badgeTotal').textContent=total;
  document.getElementById('tabCountPendiente').textContent=stats.pendientes||0;
  document.getElementById('tabCountAprobada').textContent=stats.aprobadas||0;
  document.getElementById('tabCountRechazada').textContent=stats.rechazadas||0;
  document.getElementById('tabCountTotal').textContent=stats.total||0;
  document.getElementById('sumImporte').textContent=total>0?`${Number(totalImporte).toLocaleString('es-ES',{minimumFractionDigits:2})} €`:'';
  renderLista();
  renderPager();
  // Solo re-renderizar el detalle si algo cambió de verdad (ej. otro revisor la
  // procesó mientras tanto) — si no, cada poll de 30s reconstruía el panel entero,
  // incluido el <iframe> del PDF, provocando una "recarga" visible sin motivo real.
  if(facturaActual){
    const u=facturas.find(f=>f.id===facturaActual.id);
    if(u && JSON.stringify(u)!==JSON.stringify(facturaActual)){ facturaActual=u; renderDetail(u); }
  }
}

function renderPager(){
  const el=document.getElementById('pager');
  const totalPaginas=Math.max(1,Math.ceil(total/PAGE));
  if(total<=PAGE){ el.innerHTML=''; return; }
  el.innerHTML=`<button ${pagina===0?'disabled':''} onclick="irPagina(${pagina-1})">← Anterior</button>
    <span class="pager-info">Página ${pagina+1} de ${totalPaginas}</span>
    <button ${pagina+1>=totalPaginas?'disabled':''} onclick="irPagina(${pagina+1})">Siguiente →</button>`;
}
function irPagina(p){
  pagina=p;
  document.getElementById('listaFacturas').scrollTop=0;
  cargarFacturas(false);
}

function onBuscarInput(){
  clearTimeout(buscarTimer);
  buscarTimer=setTimeout(()=>{busqueda=document.getElementById('inputBuscar').value.trim();cargarFacturas();},300);
}

function onFechaChange(){
  desde=document.getElementById('inputDesde').value;
  hasta=document.getElementById('inputHasta').value;
  document.getElementById('btnClearFecha').style.display=(desde||hasta)?'':'none';
  cargarFacturas();
}

function limpiarFechas(){
  desde='';hasta='';
  document.getElementById('inputDesde').value='';
  document.getElementById('inputHasta').value='';
  document.getElementById('btnClearFecha').style.display='none';
  cargarFacturas();
}

function toggleFiltrosAvanzados(){
  const el=document.getElementById('filtrosAvanzados');
  const btn=document.getElementById('btnFiltrosAvanzados');
  const abrir=el.style.display==='none';
  el.style.display=abrir?'flex':'none';
  btn.textContent=abrir?'Menos filtros ▴':'Más filtros ▾';
  btn.setAttribute('aria-expanded',abrir?'true':'false');
}

function onFiltroExtraChange(){
  hotelFiltro=document.getElementById('selHotelFiltro').value;
  importeMin=document.getElementById('inputImporteMin').value;
  importeMax=document.getElementById('inputImporteMax').value;
  cargarFacturas();
}

function setFiltro(f,el){
  filtroActual=f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  facturaActual=null;
  document.getElementById('detail').innerHTML='<div class="detail-empty"><div class="detail-empty-icon">📋</div><div>Selecciona una factura</div></div>';
  cargarFacturas();
}

// Etiquetas de la lista para casos que hacen perder tiempo al validar: mismo
// número de factura repetido, sin hotel identificado, o importe negativo (abono).
function tagsFactura(f){
  const tags=[];
  if(f.posible_duplicado) tags.push('<span class="tag-warn">⚠ Duplicada</span>');
  if(!f.hotel_nombre_editado && (!f.hotel_nombre_odoo || f.hotel_nombre_odoo==='No identificado')) tags.push('<span class="tag-warn">Sin hotel</span>');
  if(f.importe_total!=null && f.importe_total<0) tags.push('<span class="tag-info">↩ Abono</span>');
  return tags.join('');
}

const EMPTY_MSG={pendiente:'No hay facturas pendientes',aprobada:'No hay facturas aprobadas',rechazada:'No hay facturas rechazadas',all:'No hay facturas'};
function renderLista(){
  const el=document.getElementById('listaFacturas');
  if(!facturas.length){
    const filtrando=busqueda||desde||hasta||hotelFiltro||importeMin!==''||importeMax!=='';
    el.innerHTML=`<div class="empty-state"><div class="empty-state-icon">${filtrando?'⌕':'✓'}</div>${filtrando?'Ningún resultado con estos filtros':EMPTY_MSG[filtroActual]}</div>`;
    return;
  }
  el.innerHTML=facturas.map(f=>{
    const tags=tagsFactura(f);
    return `
    <div class="factura-item estado-${f.estado}${facturaActual?.id===f.id?' selected':''}" onclick="seleccionar(${f.id})">
      <div class="fi-header"><span class="fi-numero">${esc(f.factura_numero)||'Sin número'}</span><span class="fi-fecha" title="Recibida ${fmtDate(f.created_at)}">${fmtFecha(f.factura_fecha)}</span></div>
      <div class="fi-proveedor">${esc(f.proveedor_nombre)||'—'}</div>
      ${tags?`<div class="fi-tags">${tags}</div>`:''}
      <div class="fi-footer"><span class="fi-importe">${f.importe_total!=null?Number(f.importe_total).toLocaleString('es-ES',{minimumFractionDigits:2})+' €':'—'}</span><span class="fi-badge badge-${f.estado}">${f.estado}</span></div>
      <div class="fi-hotel">→ ${esc(nombreSinCodigo(f.hotel_nombre_editado)||f.hotel_nombre_odoo)||'Sin identificar'}</div>
    </div>`;
  }).join('');
}

async function seleccionar(id){
  facturaActual=facturas.find(f=>f.id===id)||await fetch(`/api/facturas/${id}`).then(r=>r.json());
  renderLista();
  renderDetail(facturaActual);
}

function renderDetail(f){
  const isPendiente=f.estado==='pendiente';
  const eg=Array.isArray(f.errores_graves)?f.errores_graves:[];
  const el=Array.isArray(f.errores_leves)?f.errores_leves:[];
  const motivoMap={'factura_dirigida_a_sociedad':'📋 Factura dirigida a sociedad — requiere imputación manual','multiples_centros':'🏨 Múltiples centros detectados','costes_generales_posible_hotel':'🔍 Posible hotel no identificado correctamente'};
  const motivoTxt=motivoMap[f.motivo_revision]||'';
  const alertaHotel=MOTIVOS_HOTEL.includes(f.motivo_revision);
  const tags=tagsFactura(f);
  // "Falta" = dato que normalmente debería venir dado que la factura sí tiene
  // importe/es real, distinto de "no aplica" — se resalta en vez de mostrar un
  // guion mudo igual que cualquier campo opcional.
  const faltaBase = f.importe_total!=null && f.base_imponible==null;
  const faltaFpago = f.importe_total!=null && !f.forma_pago_detalle;
  const faltaEmail = !f.email_remitente;
  document.getElementById('detail').innerHTML=`
    <div class="detail-header">
      <div>
        <div class="detail-numero">${esc(f.factura_numero)||'Sin número'}${f.factura_numero?`<button class="btn-copy" data-copy="${esc(f.factura_numero)}" onclick="copiar(this.dataset.copy)" title="Copiar número" aria-label="Copiar número de factura">📋</button>`:''}${f.estado!=='pendiente'?` <span class="fi-badge badge-${f.estado}" style="font-size:12px;margin-left:8px">${f.estado}</span>`:''}
        ${tags?`<div class="fi-tags" style="margin-top:6px">${tags}</div>`:''}</div>
        <div class="detail-proveedor">${esc(f.proveedor_nombre)||'—'}${f.proveedor_cif?` · ${esc(f.proveedor_cif)}<button class="btn-copy" data-copy="${esc(f.proveedor_cif)}" onclick="copiar(this.dataset.copy)" title="Copiar CIF" aria-label="Copiar CIF del proveedor">📋</button>`:''}</div>
      </div>
      ${isPendiente?`<div class="detail-actions"><button class="btn btn-danger" onclick="openRechazar()">✗ Rechazar <span style="opacity:.6">(R)</span></button><button class="btn btn-primary" onclick="openAprobar()">✓ Aprobar <span style="opacity:.6">(A)</span></button></div>`:`<div style="font-size:12px;color:var(--text3)">Revisada por ${esc(f.revisor_nombre)||'—'}<br>${fmtDate(f.revisado_at)}</div>`}
    </div>
    <div class="detail-body">
      ${motivoTxt?`<div style="background:var(--motivo-bg);border:1px solid var(--motivo-border);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--motivo-fg)">${motivoTxt}</div>`:''}
      ${eg.length||el.length?`<div class="card"><div class="card-header">Incidencias detectadas</div><div class="card-body"><div class="errores">${eg.map(e=>`<div class="error-item error-grave">🔴 ${esc(e)}</div>`).join('')}${el.map(e=>`<div class="error-item error-leve">🟡 ${esc(e)}</div>`).join('')}</div></div></div>`:''}
      <div class="card"><div class="card-header">Datos de la factura</div><div class="card-body">
        <div class="datos-grid">
          <div><div class="dato-label">Nº Factura</div><div class="dato-valor">${esc(f.factura_numero)||'—'}</div></div>
          <div><div class="dato-label">Fecha</div><div class="dato-valor">${fmtFecha(f.factura_fecha)}</div></div>
          <div><div class="dato-label">Importe total</div><div class="dato-valor importe${f.importe_total<0?' negativo':''}">${f.importe_total!=null?Number(f.importe_total).toLocaleString('es-ES',{minimumFractionDigits:2})+' €'+(f.importe_total<0?' (abono)':''):'—'}</div></div>
          <div><div class="dato-label">Base imponible</div><div class="dato-valor${faltaBase?' dato-falta':''}">${f.base_imponible!=null?Number(f.base_imponible).toLocaleString('es-ES',{minimumFractionDigits:2})+' €':(faltaBase?'⚠ Falta':'—')}</div></div>
          <div><div class="dato-label">Forma de pago</div><div class="dato-valor${faltaFpago?' dato-falta':''}">${esc(f.forma_pago_detalle)||(faltaFpago?'⚠ Falta':'—')}</div></div>
          <div><div class="dato-label">Recibida</div><div class="dato-valor">${fmtDate(f.created_at)}</div></div>
        </div>
        ${f.concepto?`<div style="margin-top:12px"><div class="dato-label">Concepto</div><div class="dato-valor" style="font-size:12px;line-height:1.5;color:var(--text2)">${esc(f.concepto)}</div></div>`:''}
      </div></div>
      <div class="card"><div class="card-header">Hotel / DocuWare</div><div class="card-body">
        <div class="datos-grid">
          <div><div class="dato-label">Identificado como</div><div class="dato-valor">${esc(f.hotel_nombre_odoo)||'No identificado'}</div></div>
          <div><div class="dato-label">Código hotel</div><div class="dato-valor">${esc(f.codigo_hotel)||'—'}</div></div>
          <div><div class="dato-label">Sociedad</div><div class="dato-valor">${esc(f.sociedad)||'—'}</div></div>
          <div class="${alertaHotel?'dato-alerta':''}"><div class="dato-label">DocuWare hotel</div><div class="dato-valor">${esc(nombreSinCodigo(f.hotel_nombre_editado||f.dw_hotel))||'PENDIENTE'}</div></div>
          <div><div class="dato-label">Forma de pago DW</div><div class="dato-valor">${esc(f.dw_fpago_editado||f.dw_fpago)||'—'}</div></div>
        </div>
        ${f.nota_revisor?`<div style="margin-top:12px"><div class="dato-label">Nota del revisor</div><div class="dato-valor" style="font-size:12px;color:var(--text2)">${esc(f.nota_revisor)}</div></div>`:''}
      </div></div>
      <div class="card"><div class="card-header">Email de origen</div><div class="card-body">
        <div class="datos-grid">
          <div><div class="dato-label">Remitente</div><div class="dato-valor${faltaEmail?' dato-falta':''}" style="font-size:12px">${esc(f.email_remitente)||(faltaEmail?'⚠ Falta':'—')}</div></div>
          <div><div class="dato-label">Archivo</div><div class="dato-valor" style="font-size:12px">${esc(f.detected_pdf_name)||'—'}</div></div>
        </div>
        ${f.asunto_email?`<div style="margin-top:8px"><div class="dato-label">Asunto</div><div class="dato-valor" style="font-size:12px;color:var(--text2)">${esc(f.asunto_email)}</div></div>`:''}
      </div></div>
      <div id="actividadCard"></div>
      <div class="card"><div class="card-header">Factura PDF</div>
        ${f.pdf_filename?`<iframe class="pdf-frame" src="__BASE_PATH__/api/facturas/${f.id}/pdf" title="PDF de la factura"></iframe>`:renderPdfFaltante(f)}
      </div>
    </div>`;
  cargarActividad(f.id);
}

async function cargarActividad(id){
  const logs=await fetch(`/api/facturas/${id}/log`).then(r=>r.json()).catch(()=>[]);
  const el=document.getElementById('actividadCard');
  if(!el) return; // el usuario ya cambió de factura mientras esto cargaba
  if(!logs.length){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="card"><div class="card-header">Actividad</div><div class="card-body">
    ${logs.map(l=>`<div class="actividad-item"><strong>${esc(l.accion)}</strong> por ${esc(l.usuario_nombre)||'—'} · <span style="color:var(--text3)">${fmtDate(l.created_at)}</span>${l.detalle?`<div style="color:var(--text2);margin-top:2px">${esc(l.detalle)}</div>`:''}</div>`).join('')}
  </div></div>`;
}

function renderPdfFaltante(f){
  const enlaces=[f.enlace_descarga,...(Array.isArray(f.enlaces_detectados)?f.enlaces_detectados:[])].filter(Boolean);
  // Solo http(s) como href — evita que un enlace "detectado" con esquema javascript: se ejecute al clicar.
  const links=[...new Set(enlaces)].map(u=>/^https?:\/\//i.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--accent);word-break:break-all;font-size:12px;display:block;margin-bottom:4px">${esc(u)}</a>`:`<div style="color:var(--text3);word-break:break-all;font-size:12px;margin-bottom:4px">${esc(u)}</div>`).join('');
  const puedeSubir=f.estado==='pendiente';
  // requiere_acceso_portal: el email pedía loguearse en el portal del proveedor, no hay
  // link de descarga directo — caso distinto de "solo enlace" y hay que aclararlo, si no
  // el revisor busca un botón de descarga que no existe.
  const mensaje = f.requiere_acceso_portal
    ? '⚠️ Esta factura requiere acceder al portal del proveedor para descargarla — no llegó ningún enlace directo, hay que entrar a la web del proveedor manualmente.'
    : (f.solo_enlace ? 'Esta factura no llegó con PDF adjunto, solo enlace(s) de descarga.' : 'PDF no disponible.');
  return `<div class="pdf-unavail">
    <div>📄 ${mensaje}</div>
    ${links?`<div style="width:100%;text-align:left">${links}</div>`:''}
    ${puedeSubir?`<div style="width:100%;text-align:left;margin-top:8px">
      <label class="form-label" for="inputSubirPdf">Descarga el PDF del enlace y súbelo aquí para poder aprobar</label>
      <input type="file" accept="application/pdf" id="inputSubirPdf" style="width:100%;font-size:12px;color:var(--text2);margin-bottom:8px">
      <button class="btn btn-secondary btn-sm" onclick="subirPdf(${f.id})">Subir PDF</button>
    </div>`:''}
  </div>`;
}

async function subirPdf(id){
  const input=document.getElementById('inputSubirPdf');
  const file=input?.files?.[0];
  if(!file){toast('Selecciona un archivo PDF','error');return;}
  const b64=await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
  const r=await fetch(`/api/facturas/${id}/pdf-upload`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pdf_base64:b64,filename:file.name})});
  const d=await r.json();
  if(r.ok){toast('PDF subido','success');facturaActual=await fetch(`/api/facturas/${id}`).then(x=>x.json());renderDetail(facturaActual);}
  else toast('Error: '+d.error,'error');
}

function openAprobar(){
  if(!facturaActual)return;
  if(!facturaActual.pdf_filename){toast('Esta factura no tiene PDF. Súbelo antes de aprobar.','error');return;}
  const actual=facturaActual.hotel_nombre_editado||facturaActual.dw_hotel||'';
  // value = "código. Nombre" (lo que espera DocuWare) — label = solo el nombre para el revisor.
  const opciones=Object.entries(HOTELES).sort((a,b)=>a[1].localeCompare(b[1])).map(([cod,nom])=>({value:`${cod}. ${nom}`,label:nom}));
  if(actual && !opciones.some(o=>o.value===actual)) opciones.unshift({value:actual,label:nombreSinCodigo(actual)});
  document.getElementById('inputHotel').innerHTML=opciones.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('');
  document.getElementById('inputHotel').value=actual;
  document.getElementById('inputFpago').value=facturaActual.dw_fpago_editado||facturaActual.dw_fpago||'';
  document.getElementById('inputNotaAprobar').value='';
  document.getElementById('modalAprobar').classList.add('open');
}
function openRechazar(){document.getElementById('inputNotaRechazar').value='';document.getElementById('modalRechazar').classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

// Tras aprobar/rechazar, si se estaba en la pestaña Pendientes, selecciona sola la
// siguiente pendiente en vez de dejar el panel vacío — evita el clic extra por cada
// factura cuando hay varias en cola.
function avanzarSiguiente(idxAnterior){
  if(filtroActual==='pendiente' && facturas.length){
    const next=facturas[idxAnterior]||facturas[idxAnterior-1];
    if(next){ seleccionar(next.id); return; }
  }
  facturaActual=null;
  document.getElementById('detail').innerHTML='<div class="detail-empty"><div class="detail-empty-icon">✓</div><div>No quedan facturas pendientes</div></div>';
}

// ── Confirmación con "deshacer" ──────────────────────────────────────────────
// Aprobar/rechazar dispara un archivado/notificación real en DocuWare/n8n, así
// que en vez de ejecutarlo al toque se deja una ventana de unos segundos para
// cancelar por error de clic, en vez de un confirm() más de los que la gente
// aprende a descartar sin leer.
let accionPendiente=null;
function programarAccion(mensaje, ejecutar){
  if(accionPendiente){ clearTimeout(accionPendiente.timeoutId); accionPendiente.ejecutar(); }
  document.getElementById('undoMsg').textContent=mensaje;
  document.getElementById('undoBanner').classList.add('show');
  const timeoutId=setTimeout(()=>{
    document.getElementById('undoBanner').classList.remove('show');
    const a=accionPendiente; accionPendiente=null;
    if(a) a.ejecutar();
  }, 4000);
  accionPendiente={timeoutId, ejecutar};
}
function deshacerAccion(){
  if(!accionPendiente) return;
  clearTimeout(accionPendiente.timeoutId);
  accionPendiente=null;
  document.getElementById('undoBanner').classList.remove('show');
  toast('Acción cancelada','success');
}

function confirmarAprobar(){
  const facturaId=facturaActual.id;
  const numero=facturaActual.factura_numero||facturaId;
  const idxAnterior=facturas.findIndex(f=>f.id===facturaId);
  const hotel_nombre_editado=document.getElementById('inputHotel').value;
  const dw_fpago_editado=document.getElementById('inputFpago').value;
  const nota_revisor=document.getElementById('inputNotaAprobar').value;
  closeModal('modalAprobar');
  programarAccion(`Aprobando factura ${numero}…`, async ()=>{
    const r=await fetch(`/api/facturas/${facturaId}/aprobar`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hotel_nombre_editado,dw_fpago_editado,nota_revisor})});
    const d=await r.json();
    if(r.ok){toast('✓ '+(d.mensaje||'Factura aprobada'),'success');await cargarFacturas();avanzarSiguiente(idxAnterior);}
    else toast('Error: '+d.error,'error');
  });
}

function confirmarRechazar(){
  const nota_revisor=document.getElementById('inputNotaRechazar').value.trim();
  if(!nota_revisor){toast('El motivo del rechazo es obligatorio','error');return;}
  const facturaId=facturaActual.id;
  const numero=facturaActual.factura_numero||facturaId;
  const idxAnterior=facturas.findIndex(f=>f.id===facturaId);
  closeModal('modalRechazar');
  programarAccion(`Rechazando factura ${numero}…`, async ()=>{
    const r=await fetch(`/api/facturas/${facturaId}/rechazar`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nota_revisor})});
    const d=await r.json();
    if(r.ok){toast('Factura rechazada','success');await cargarFacturas();avanzarSiguiente(idxAnterior);}
    else toast('Error: '+d.error,'error');
  });
}

async function openAdmin(){await cargarUsuarios();document.getElementById('modalAdmin').classList.add('open');}
async function cargarUsuarios(){
  const us=await fetch('/api/usuarios').then(r=>r.json());
  document.getElementById('listaUsuarios').innerHTML=us.map(u=>`<div class="admin-user-row"><div class="admin-user-name"><strong>${esc(u.nombre)}</strong><span style="color:var(--text3);font-size:11px;margin-left:8px">@${esc(u.username)}</span></div><span class="admin-user-rol">${esc(u.rol)}</span>${u.rol!=='admin'?`<button class="btn btn-danger btn-sm" onclick="eliminarUsuario(${u.id})">Eliminar</button>`:''}</div>`).join('');
}
async function crearUsuario(){
  const r=await fetch('/api/usuarios',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:document.getElementById('newNombre').value,username:document.getElementById('newUsername').value,password:document.getElementById('newPassword').value,rol:document.getElementById('newRol').value})});
  const d=await r.json();
  if(r.ok){toast('Usuario creado','success');document.getElementById('newNombre').value='';document.getElementById('newUsername').value='';document.getElementById('newPassword').value='';await cargarUsuarios();}
  else toast(d.error,'error');
}
async function eliminarUsuario(id){if(!confirm('¿Eliminar usuario?'))return;await fetch(`/api/usuarios/${id}`,{method:'DELETE'});await cargarUsuarios();}
async function logout(){await fetch('/api/logout',{method:'POST'});window.location.href='__BASE_PATH__/login';}
function fmtDate(dt){if(!dt)return'—';return new Date(dt).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
// factura_fecha es texto "YYYY-MM-DD" plano (sin hora) — se reordena directo para evitar que
// pasarlo por Date()/toLocaleString corra el día según la zona horaria del navegador.
function fmtFecha(f){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(f||'');return m?`${m[3]}/${m[2]}/${m[1]}`:'—';}
function toast(msg,type='success'){const el=document.getElementById('toast');el.textContent=msg;el.className=`toast ${type} show`;setTimeout(()=>el.classList.remove('show'),3500);}
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));

// Atajos de teclado: A/R aprobar-rechazar, ↑/↓ moverse por la lista actual. Se
// desactivan mientras se escribe en un campo o hay un modal abierto.
document.addEventListener('keydown', e => {
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select') return;
  if(document.querySelector('.modal-overlay.open')) return;
  if(!facturaActual) return;
  if((e.key==='a'||e.key==='A') && facturaActual.estado==='pendiente'){ e.preventDefault(); openAprobar(); }
  else if((e.key==='r'||e.key==='R') && facturaActual.estado==='pendiente'){ e.preventDefault(); openRechazar(); }
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const idx=facturas.findIndex(f=>f.id===facturaActual.id);
    if(idx<0) return;
    const next = e.key==='ArrowDown' ? facturas[idx+1] : facturas[idx-1];
    if(next) seleccionar(next.id);
  }
});

init();
</script>
