<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log — Facturas Alda Hotels</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(!t)t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --bg:#f3f4f7;--surface:#ffffff;--surface2:#eef0f4;--surface3:#e4e7ee;--border:#e0e3ea;
  --text:#1c2029;--text2:#5b6472;--text3:#6b7280;
  --accent:#4f46e5;--accent2:#4338ca;
  --green:#0f9d58;--red:#dc2626;--yellow:#b45309;
  --shadow-sm:0 1px 2px rgba(15,17,25,.06);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1117;--surface:#1a1d27;--surface2:#21253a;--surface3:#282c40;--border:#2a2d3e;
  --text:#f9fafb;--text2:#9ca3af;--text3:#8792a6;
  --accent:#6366f1;--accent2:#818cf8;
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;
  --shadow-sm:0 1px 2px rgba(0,0,0,.25);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:20px;border:2px solid var(--bg)}
*{scrollbar-width:thin;scrollbar-color:var(--surface2) transparent}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:16px}
.logo-mark{width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,var(--accent),var(--accent2));flex-shrink:0}
.logo-text{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.logo-sep{width:1px;height:20px;background:var(--border)}
.header-title{font-size:13px;color:var(--text2)}
.header-right{display:flex;align-items:center;gap:12px}
.btn-icon{background:none;border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;transition:all .15s}
.btn-icon:hover{border-color:var(--text3);color:var(--text);background:var(--surface2)}
main{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:20px 24px;gap:14px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar select,.toolbar input[type=text],.toolbar input[type=search]{padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
.toolbar select:focus,.toolbar input:focus{border-color:var(--accent)}
.search-wrap{position:relative}
.search-wrap::before{content:'⌕';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.search-wrap input{padding-left:28px!important;width:220px}
.fecha-row{display:flex;align-items:center;gap:6px}
.fecha-row input[type=date]{padding:7px 8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;outline:none}
.fecha-row span{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.btn-clear-fecha{background:none;border:1px solid var(--border);color:var(--text3);border-radius:6px;padding:6px 8px;font-size:11px;cursor:pointer}
.btn-clear-fecha:hover{color:var(--text);border-color:var(--text3)}
.toolbar-spacer{flex:1}
.toolbar-info{font-size:12px;color:var(--text2);white-space:nowrap}
.toolbar-info strong{color:var(--text)}
.btn{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);transition:all .15s}
.btn:hover{border-color:var(--text3);background:var(--surface3)}
.sort-row{display:flex;align-items:center;gap:6px}
.sort-row select{padding:7px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;outline:none}
.lista{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.ficha{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-sm);overflow:hidden}
.ficha summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:14px;font-size:13px}
.ficha summary:hover{background:var(--surface2)}
.ficha summary::-webkit-details-marker{display:none}
.ficha summary::before{content:'▸';color:var(--text3);font-size:11px;transition:transform .15s;flex-shrink:0}
.ficha[open] summary::before{transform:rotate(90deg)}
.ficha[open] summary{border-bottom:1px solid var(--border)}
.s-fecha{color:var(--text3);font-size:12px;white-space:nowrap;flex-shrink:0}
.s-num{font-family:monospace;font-size:12px;color:var(--text2);flex-shrink:0}
.s-proveedor{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-hotel{color:var(--text2);font-size:12px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.s-importe{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;flex-shrink:0;min-width:90px;text-align:right}
.s-badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;text-transform:uppercase;white-space:nowrap;flex-shrink:0;background:var(--surface3);color:var(--text2)}
.s-badge.ok{background:rgba(15,157,88,.15);color:var(--green)}
.s-badge.bad{background:rgba(220,38,38,.15);color:var(--red)}
.ficha-body{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 24px;background:var(--surface2)}
.campo{display:flex;flex-direction:column;gap:2px;min-width:0}
.campo label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);font-weight:700}
.campo span{font-size:13px;color:var(--text);word-break:break-word}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;color:var(--text3);font-size:13px;gap:10px}
.empty-state-icon{font-size:32px;opacity:.35}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent2);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer-bar{display:flex;justify-content:center;padding:14px}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <span class="logo-text"><span class="logo-mark"></span>Alda Hotels</span>
    <div class="logo-sep"></div>
    <span class="header-title">Log de procesamiento (n8n)</span>
  </div>
  <div class="header-right">
    <button class="btn-icon" onclick="window.location.href='__BASE_PATH__/historico'" title="Histórico de revisión">📊 Histórico</button>
    <button class="btn-icon" onclick="window.location.href='__BASE_PATH__/'" title="Volver a revisión">← Revisión</button>
    <button class="btn-icon" id="btnTheme" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">🌙</button>
    <button class="btn-icon" onclick="logout()">Salir</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="search-wrap">
      <input type="search" id="inputBuscar" placeholder="Buscar por proveedor, nº factura, hotel..." oninput="onBuscarInput()" aria-label="Buscar en el log">
    </div>
    <div class="fecha-row">
      <span>Del</span>
      <input type="date" id="inputDesde" onchange="onFiltroChange()" aria-label="Fecha desde">
      <span>al</span>
      <input type="date" id="inputHasta" onchange="onFiltroChange()" aria-label="Fecha hasta">
      <button class="btn-clear-fecha" id="btnClearFecha" onclick="limpiarFechas()" style="display:none" title="Quitar filtro de fechas" aria-label="Quitar filtro de fechas">✕</button>
    </div>
    <div class="sort-row">
      <select id="selSort" onchange="onSortChange()" aria-label="Ordenar por"></select>
      <button class="btn-icon" id="btnDir" onclick="toggleDir()" title="Invertir orden">↓</button>
    </div>
    <div class="toolbar-spacer"></div>
    <span class="toolbar-info" id="toolbarInfo"></span>
    <button class="btn" onclick="exportarCSV()">⬇ Exportar CSV</button>
  </div>

  <div class="lista" id="lista">
    <div class="empty-state"><div class="spinner"></div>Cargando...</div>
  </div>
  <div class="footer-bar" id="footerBar"></div>
</main>

<script>
const _fetch=window.fetch;
window.fetch=async(...args)=>{
  if(typeof args[0]==='string' && args[0].startsWith('/')) args[0]='__BASE_PATH__'+args[0];
  const r=await _fetch(...args);
  if(r.status===401){ window.location.href='__BASE_PATH__/login'; throw new Error('Sesión expirada'); }
  return r;
};

function toggleTheme(){
  const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('theme',next);
  document.getElementById('btnTheme').textContent=next==='dark'?'☀️':'🌙';
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('btnTheme').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙';
});

function esc(s){return s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtFecha(f){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(f||'');return m?`${m[3]}/${m[2]}/${m[1]}`:'—';}
function fmtImporte(n){return n!=null?Number(n).toLocaleString('es-ES',{minimumFractionDigits:2})+' €':'—';}
function fmtDateTime(dt){if(!dt)return'—';return new Date(dt).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}

// Mismas columnas que el Excel Log_Facturas_PRO, en el mismo orden. `key` es el
// campo tal cual lo guarda el portal (ver src/db.js); `sort` solo en las columnas
// que el backend sabe ordenar (whitelist en getFacturas.SORT_COLS).
const COLUMNAS=[
  {key:'created_at',    label:'Fecha recepción', sort:'created_at', type:'datetime'},
  {key:'hotel_destino_factura',   label:'Hotel destino'},
  {key:'sociedad_destino_factura',label:'Sociedad destino'},
  {key:'email_remitente', label:'Email remitente'},
  {key:'asunto_email',    label:'Asunto email'},
  {key:'detected_pdf_name', label:'Nombre adjunto'},
  {key:'factura_numero', label:'Nº Factura', sort:'factura_numero'},
  {key:'proveedor_nombre', label:'Proveedor', sort:'proveedor_nombre'},
  {key:'proveedor_cif',  label:'CIF proveedor'},
  {key:'factura_fecha',  label:'Fecha factura', sort:'factura_fecha', type:'fecha'},
  {key:'importe_total',  label:'Importe', sort:'importe_total', type:'importe'},
  {key:'forma_pago_detalle', label:'Forma de pago'},
  {key:'hotel_nombre_odoo', label:'Hotel Odoo'},
  {key:'sociedad',       label:'Sociedad'},
  {key:'codigo_hotel',   label:'Código hotel'},
  {key:'nivel_validacion', label:'Nivel validación'},
  {key:'metodo_identificacion', label:'Método identificación'},
  {key:'dw_hotel',       label:'DW Hotel'},
  {key:'dw_fpago',       label:'DW FPago'},
  {key:'fecha_docuware', label:'Fecha DocuWare', type:'datetime'},
  {key:'resultado_docuware', label:'Resultado DocuWare'},
  {key:'estado_final',   label:'Estado final'},
  {key:'motivo_revision', label:'Motivo revisión'},
  {key:'carpeta_imap',   label:'Carpeta IMAP'},
  {key:'updated_at',     label:'Fecha fin', type:'datetime'},
];

document.getElementById('selSort').innerHTML = COLUMNAS.filter(c=>c.sort).map(c=>
  `<option value="${c.sort}">${esc(c.label)}</option>`
).join('');

let items=[], offset=0, total=0, busqueda='', desde='', hasta='', sort='created_at', dir='desc', buscarTimer=null;
const PAGE=150;

function fmtCelda(f,c){
  const v=f[c.key];
  if(c.type==='datetime') return fmtDateTime(v);
  if(c.type==='fecha') return fmtFecha(v);
  if(c.type==='importe') return fmtImporte(v);
  return esc(v)||'—';
}

let reqId=0;
async function cargar(reset=true){
  if(reset) offset=0;
  const params=new URLSearchParams({offset,limit:PAGE,sort,dir});
  if(busqueda) params.set('q',busqueda);
  if(desde) params.set('desde',desde);
  if(hasta) params.set('hasta',hasta);
  const id=++reqId;
  const {items:page,total:t}=await fetch(`/api/facturas?${params}`).then(r=>r.json()).catch(()=>({items:[],total:0}));
  if(id!==reqId) return;
  items = reset ? page : items.concat(page);
  total=t;
  document.getElementById('toolbarInfo').innerHTML=total>0?`<strong>${total}</strong> registros`:'';
  renderLista();
  renderFooter();
}

function renderFooter(){
  const el=document.getElementById('footerBar');
  el.innerHTML = items.length<total ? `<button class="btn" onclick="cargarMas()">Cargar más (${items.length}/${total})</button>` : '';
}
function cargarMas(){offset+=PAGE;cargar(false);}

function badgeClase(estadoFinal){
  const s=(estadoFinal||'').toLowerCase();
  if(s.includes('rechaz')) return 'bad';
  if(s.includes('aprob')||s.includes('archiv')) return 'ok';
  return '';
}

function renderLista(){
  const lista=document.getElementById('lista');
  if(!items.length){
    const filtrando=busqueda||desde||hasta;
    lista.innerHTML=`<div class="empty-state"><div class="empty-state-icon">${filtrando?'⌕':'📄'}</div>${filtrando?'Ningún resultado con estos filtros':'No hay registros'}</div>`;
    return;
  }
  lista.innerHTML=items.map(f=>`
    <details class="ficha">
      <summary>
        <span class="s-fecha">${fmtDateTime(f.created_at)}</span>
        <span class="s-num">${esc(f.factura_numero)||'—'}</span>
        <span class="s-proveedor">${esc(f.proveedor_nombre)||'—'}</span>
        <span class="s-hotel">${esc(f.hotel_destino_factura)||'—'}</span>
        <span class="s-importe">${fmtImporte(f.importe_total)}</span>
        <span class="s-badge ${badgeClase(f.estado_final)}">${esc(f.estado_final)||'—'}</span>
      </summary>
      <div class="ficha-body">
        ${COLUMNAS.map(c=>`<div class="campo"><label>${esc(c.label)}</label><span>${fmtCelda(f,c)}</span></div>`).join('')}
      </div>
    </details>
  `).join('');
}

function onFiltroChange(){
  desde=document.getElementById('inputDesde').value;
  hasta=document.getElementById('inputHasta').value;
  document.getElementById('btnClearFecha').style.display=(desde||hasta)?'':'none';
  cargar();
}
function onBuscarInput(){
  clearTimeout(buscarTimer);
  buscarTimer=setTimeout(()=>{busqueda=document.getElementById('inputBuscar').value.trim();cargar();},300);
}
function limpiarFechas(){
  desde='';hasta='';
  document.getElementById('inputDesde').value='';
  document.getElementById('inputHasta').value='';
  document.getElementById('btnClearFecha').style.display='none';
  cargar();
}

document.getElementById('selSort').value=sort;
function onSortChange(){
  sort=document.getElementById('selSort').value;
  cargar();
}
function toggleDir(){
  dir = dir==='asc' ? 'desc' : 'asc';
  document.getElementById('btnDir').textContent = dir==='asc' ? '↑' : '↓';
  cargar();
}

async function exportarCSV(){
  const params=new URLSearchParams({offset:0,limit:1000,sort,dir});
  if(busqueda) params.set('q',busqueda);
  if(desde) params.set('desde',desde);
  if(hasta) params.set('hasta',hasta);
  const {items:rows}=await fetch(`/api/facturas?${params}`).then(r=>r.json());
  const cols=COLUMNAS.map(c=>c.key);
  const csvEsc=v=>{ if(v==null) return ''; const s=String(v).replace(/"/g,'""'); return /[",\n]/.test(s)?`"${s}"`:s; };
  const csv=[COLUMNAS.map(c=>c.label).join(',')].concat(rows.map(r=>cols.map(c=>csvEsc(r[c])).join(','))).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`log_facturas_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function logout(){await fetch('/api/logout',{method:'POST'});window.location.href='__BASE_PATH__/login';}

cargar();
</script>
</body>
</html>
